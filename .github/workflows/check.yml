name: Offline contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run stdlib contract tests without models or package installation
        run: python3 -m unittest discover -s demo -p 'test_*.py' -v
      - name: Run synthetic CLI
        run: python3 -m demo --compact
      - name: Check arithmetic, text pipeline contracts and saved-run evaluation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise auditable metric example
        run: python3 tools/coverage_model.py --example | python3 tools/coverage_model.py -
      - name: Verify saved live experiment evidence without inference
        run: python3 scripts/check_live_runs.py
      - name: Verify auxiliary smoke evidence and historical source bytes
        run: python3 scripts/verify_auxiliary_evidence.py
      - name: Verify frozen comparison protocol and all three completed runs
        run: python3 scripts/verify_holdout_protocol.py
      - name: Check final solution size and required submission files
        run: >-
          python3 scripts/check_submission.py
          --require-file docs/solution.md
          --require-file docs/metrics.md
          --require-file submission/solution.docx
          --require-file submission/solution.pdf
          --require-file submission/presentation.pptx
          --require-file submission/metrics.md
